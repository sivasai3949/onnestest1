name: 🚀 Frontend Live Deployment

on:
  push:
    branches:
      - '16-04-25'
    tags:
      - 'live-deploy'

jobs:
  deploy:
    name: 🌍 Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3

    - name: 🛠️ Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 📦 Install dependencies with legacy peer deps
      run: |
        cd arino-react
        npm install --legacy-peer-deps

    - name: 🏗️ Build frontend
      run: |
        cd arino-react
        CI=false npm run build

    - name: 🚚 Upload new build to EC2 (temp folder)
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "arino-react/build/*"
        target: "/home/ubuntu/temp_build"

    - name: 🔐 SSH - Move files with sudo
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "✅ Cleaning old build..."
          sudo rm -rf /var/www/html/*
          echo "🚚 Copying new build to /var/www/html..."
          sudo cp -r /home/ubuntu/temp_build/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html
          echo "✅ Restarting Nginx..."
          sudo systemctl restart nginx
