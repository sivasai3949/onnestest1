name: 🚀 Frontend Live Deployment

on:
  push:
    branches:
      - '16-04-25'
    tags:
      - 'live-deploy'

jobs:
  deploy:
    name: 🌍 Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3

    - name: 🛠️ Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 📦 Install dependencies with legacy peer deps
      run: |
        cd arino-react
        npm install --legacy-peer-deps

    - name: 🏗️ Build frontend
      run: |
        cd arino-react
        CI=false npm run build  # 🔧 Disable CI mode to avoid warnings-as-errors

    - name: 🔐 SSH & Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "✅ Stashing any local changes just in case..."
          cd /var/www/html
          sudo rm -rf *
          echo "🧹 Old build removed from /var/www/html"

    - name: 🚚 Upload new build to EC2
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "arino-react/build"
        target: "/var/www/html"
        strip_components: 2  # 👈 Ensures only build/* content is placed in /var/www/html

    - name: 🔁 Reload and Restart Nginx
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🔁 Reloading and Restarting Nginx..."
          sudo systemctl reload nginx
          sudo systemctl restart nginx
          echo "✅ Deployment completed and Nginx restarted!"
