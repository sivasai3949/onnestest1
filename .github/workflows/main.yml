name: 🚀 Frontend Live Deployment

on:
  push:
    branches:
      - '16-04-25'
    tags:
      - 'live-deploy'

jobs:
  deploy:
    name: 🌍 Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3

    - name: 🚚 Upload new build to EC2 (temp folder)
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "arino-react/build/*"
        target: "/home/ubuntu/temp_build"

    - name: 🔐 SSH - Run deploy.sh on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "✅ Running deploy.sh script on EC2..."
          sudo bash /home/ubuntu/deploy.sh
