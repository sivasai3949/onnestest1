name: 🚀 Fullstack Live Deployment

on:
  push:
    branches:
      - 'pipelinetesting'   # 🎯 Trigger this when pushing to 'prod-deploy' branch
    tags:
      - 'live-deploy'   # 🏷️ Optional: can also trigger via Git tag

jobs:
  deploy:
    name: 🌍 Deploy Fullstack App to EC2
    runs-on: ubuntu-latest  # 💻 Run on Ubuntu environment

    steps:
    
    # Step 1: 🧾 Checkout your GitHub repository code
    - name: 📦 Checkout Repository
      uses: actions/checkout@v3

    # Step 2: 🚚 Upload fullstack project (frontend + backend)
    - name: 🚚 Upload Fullstack Code to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}       # 🔐 EC2 IP (from secrets)
        username: ${{ secrets.EC2_USER }}   # 🔐 e.g., "ubuntu"
        key: ${{ secrets.EC2_SSH_KEY }}     # 🔐 Private SSH key
        source: "arino-react"               # 📂 Folder to upload (contains both frontend + backend)
        target: "/home/ubuntu/onnestest1"   # 📍 Upload location on EC2

    # Step 3: 🖥️ SSH into EC2 and run the deployment script
    - name: 🔐 SSH - Run deploy.sh Script on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "✅ Starting Remote Deployment via deploy.sh..."
          cd /home/ubuntu || exit 1
          sudo bash deploy.sh  # Run the deploy script directly
